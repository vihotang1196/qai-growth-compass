# Supabase 本地配置。
#
# project_id 由 `supabase link --project-ref <ref>` 写入。ref 不是密钥
# (它出现在每个 API URL 里),CLI 写进来之后直接 commit,别为它加 gitignore ——
# 那会连下面的 verify_jwt / import_map 声明一起丢掉。
#
# 所有客户侧函数都 verify_jwt = false:鉴权由函数内部自己做,而且各不相同 ——
# webhook 查共享密钥、客户端查 session cookie、admin 查 JWT + 允许名单。
# 交给平台统一验 JWT 反而拦掉 GHL 这种没有 Supabase 身份的调用方。
#
# ── import_map 为什么必须显式声明 ──────────────────────────────────
# 我们的 import map 在 supabase/functions/deno.json,也就是【函数目录的上一层】。
# CLI 为某个函数查找 import map 时不会往上一层找,于是 deploy 时那份文件
# 根本没被上传 —— 服务端打包器拿不到映射,裸标识符 @supabase/supabase-js
# 直接报 "Relative import path not prefixed with / or ./ or ../"。
#
# 把它放在共享位置是有理由的:libphonenumber-js 的版本必须与 package.json
# 保持一致(见 scripts/check-dep-sync.mjs),一份共享的 map 才守得住。
# 所以不是把 map 挪到每个函数目录下(那就每个函数一份副本),而是显式声明路径。
#
# 路径相对 config.toml 所在目录(即 supabase/)。
# 这条声明由 `npm run check:dep-sync` 强制:函数目录存在但没有对应的
# [functions.<name>] + import_map,构建失败。

[functions.assessment-ghl-webhook]
verify_jwt = false
import_map = "./functions/deno.json"

# 客户端调用,鉴权靠 access_token 本身 + session cookie。
# 走 Vercel 的 /api/* 代理进来,平台层的 JWT 校验只会拦掉正常客户。
[functions.assessment-auth]
verify_jwt = false
import_map = "./functions/deno.json"

# 备用路径:重发魔法链接。未登录状态调用,鉴权靠 IP 限流 + 恒定耗时。
[functions.assessment-login-request]
verify_jwt = false
import_map = "./functions/deno.json"

# 保留策略清理。由 Vercel Cron 经 INTERNAL_FN_SECRET 调用,不对外。
[functions.assessment-maintenance]
verify_jwt = false
import_map = "./functions/deno.json"

# 后台的唯一入口,按 action 分发。鉴权在函数内部:每次验 Supabase Auth 的 JWT
# 并查 admin_users 允许名单,不信任前端路由守卫。
[functions.assessment-admin]
verify_jwt = false
import_map = "./functions/deno.json"

# 答题过程的读写。cookie 鉴权(compass_session),分数一律服务端按配置查表算。
[functions.assessment-quiz]
verify_jwt = false
import_map = "./functions/deno.json"

# 问卷提交 + 计分 + 写结果 + GHL 写回。cookie 鉴权,分数一律服务端算。
[functions.assessment-score]
verify_jwt = false
import_map = "./functions/deno.json"

# GHL 写回的重试 sweep(D2 消费端)。内部接口,X-Internal-Secret 鉴权,不进 /api 代理。
[functions.assessment-ghl-resync]
verify_jwt = false
import_map = "./functions/deno.json"

# 报告页取数。GET,cookie 鉴权,只读(不重算分数、不触发渲染)。
# 学员自己触发生成某种语言的报告文件。cookie 鉴权,只接受 lang(session 从 cookie 来)。
# 刻意不复用 Admin 的 render_pdf action —— 那会给一个只有管理员能碰的入口多开一条学员的路,
# 而以后给它加功能的人不会想到这件事。留痕也分开:Admin 记「谁点的」,这里记「哪个 session」。
[functions.assessment-report-file]
verify_jwt = false
import_map = "./functions/deno.json"

[functions.assessment-report]
verify_jwt = false
import_map = "./functions/deno.json"
